<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MEKATRONIC TELEMETRY</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="bg"></div>

<div class="dashboard">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

<!-- TITLE -->

<div class="titleBox">

<h1>MEKATRONIC TEAM TELEMETRY</h1>

<p>KMHE SYSTEM</p>

</div>

<!-- SPEED -->

<div class="card speedCard">

<h2>SPEED</h2>

<div class="speedValue">

<span id="speed">0</span>

<small>km/h</small>

</div>

</div>

<!-- TIME -->

<div class="card">

<h2>TIME</h2>

<div class="timeRow">

<p>TOTAL TIME</p>

<h3 id="totalTime">00:00</h3>

</div>

<div class="timeRow">

<p>BEST LAP</p>

<h3 id="bestLap">00:00</h3>

</div>

<div class="timeRow">

<p>LAST LAP</p>

<h3 id="lastLap">00:00</h3>

</div>

</div>

<!-- LAP HISTORY -->

<div class="card lapCard">

<h2>LAP HISTORY</h2>

<div id="lapHistory">

NO DATA

</div>

</div>

<!-- CONTROLS -->

<div class="card">

<h2>CONTROLS</h2>

<select id="modeSelect">

<option value="auto">
AUTO MODE
</option>

<option value="manual">
MANUAL MODE
</option>

</select>

<div class="buttonGroup">

<button class="startBtn"
onclick="startRace()">

START

</button>

<button class="lapBtn"
id="lapBtn"
onclick="manualLap()">

LAP

</button>

<button class="stopBtn"
onclick="stopRace()">

STOP

</button>

<button class="resetBtn"
onclick="resetRace()">

RESET

</button>

</div>

</div>

<!-- SAT + GPS -->

<div class="bottomInfo">

<!-- SAT -->

<div class="card miniCard">

<h2>SATELLITE</h2>

<div class="satBox">

<div class="satIcon">🛰</div>

<div>

<h1 id="sat">0</h1>

<p>Satellites</p>

</div>

</div>

</div>

<!-- GPS -->

<div class="card miniCard">

<h2>GPS COORDINATES</h2>

<div class="gpsRow">

<p>LATITUDE</p>

<h3 id="lat">0</h3>

</div>

<div class="gpsRow">

<p>LONGITUDE</p>

<h3 id="lng">0</h3>

</div>

</div>

</div>

</div>

<!-- ================= MAP ================= -->

<div class="mapSection">

<!-- STATUS -->

<div class="topStatus">

<div class="statusBox">

MQTT STATUS

<h2 id="mqtt-status">

ONLINE

</h2>

</div>

<div class="statusBox">

LAP STATUS

<h2 id="lapStatus">

READY

</h2>

</div>

</div>

<!-- MAP -->

<div id="map"></div>

<!-- ROUTE -->

<div class="routeBox">

<div class="line"></div>

TRACK / ROUTE

</div>

</div>

</div>

<script src=
"https://unpkg.com/leaflet/dist/leaflet.js">
</script>

<script src=
"https://unpkg.com/mqtt/dist/mqtt.min.js">
</script>

<script src="script.js"></script>

</body>
</html>
